            <strong>Nausicaä of the Valley of the Wind</strong>
            <p>Nausicaä of the Valley of the Wind is a 1984 Japanese animated post-apocalyptic fantasy film written and directed by Hayao Miyazaki, based on his 1982 manga of the same name. It was produced by Topcraft Limited Company and distributed by Toei Company. Joe Hisaishi, in his first collaboration with Miyazaki, composed the score. The film stars the voices of Sumi Shimamoto, Gorō Naya, Yōji Matsuda, Yoshiko Sakakibara, and Iemasa Kayumi. Set in a post-nuclear futuristic world, it tells the story of Nausicaä (Shimamoto), the pacifist teenage princess of the Valley of the Wind who becomes embroiled in a struggle with Tolmekia, an empire that attempts to use an ancient weapon to eradicate a jungle populated by oversized, mutant insects.

            Nausicaä of the Valley of the Wind was released in Japan on 11 March 1984. The film received critical acclaim, with praise being directed at the story, themes, characters and animation. It is commonly regarded as one of the greatest animated films, and was the second-highest-ranked animation in a poll conducted by Japan's Agency for Cultural Affairs in 2006. Though it was released before Studio Ghibli was founded, it is often considered a Ghibli work due to its themes, and is usually released as part of DVD and Blu-ray collections of Ghibli work.</p>
